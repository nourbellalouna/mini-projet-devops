<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un incident</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>Gestion des incidents informatiques</h1>
        <p>Enregistrer un nouvel incident</p>
    </header>

    <main class="container">

        <div class="form-container">
            <h2>Ajouter un incident</h2>

            <form method="POST" action="{{ url_for('ajouter') }}">

                <div class="form-group">
                    <label for="titre">Titre</label>
                    <input type="text" id="titre" name="titre"
                           placeholder="Exemple : Problème de connexion Internet"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"
                              rows="5"
                              placeholder="Décrivez le problème rencontré..."
                              required></textarea>
                </div>

                <div class="form-group">
                    <label for="lieu">Lieu</label>
                    <input type="text" id="lieu" name="lieu"
                           placeholder="Exemple : Salle B12"
                           required>
                </div>

                <div class="form-group">
                    <label for="priorite">Priorité</label>
                    <select id="priorite" name="priorite" required>
                        <option value="">Choisir une priorité</option>
                        <option value="Faible">Faible</option>
                        <option value="Moyenne">Moyenne</option>
                        <option value="Élevée">Élevée</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        Enregistrer
                    </button>

                    <a href="{{ url_for('index') }}" class="btn btn-secondary">
                        Annuler
                    </a>
                </div>

            </form>
        </div>

    </main>

</body>
</html>
